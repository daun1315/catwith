<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연간 일정 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --ink:#0A0A0A;
    --muted:#6B6B6B;
    --line:#0A0A0A;
    --grid-line:#D8D8D8;
    --hover:#F2F2F2;
    --radius:0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR", sans-serif;
    font-size:17px;
    padding:32px clamp(16px,3.4vw,48px) 64px;
    letter-spacing:-0.01em;
  }
  button, input, select{font-family:inherit;}

  /* ---------- Header ---------- */
  header{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    border-bottom:2px solid var(--ink);
    padding-bottom:20px;
    margin-bottom:22px;
  }
  .title-block h1{
    font-weight:900;
    font-size:clamp(30px,3.2vw,40px);
    margin:0 0 8px;
  }
  .title-block p{
    margin:0;
    color:var(--muted);
    font-size:16px;
  }
  #rangeLabel{font-weight:700;color:var(--ink);}

  .header-actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .date-nav{display:flex;align-items:center;gap:7px;}
  select{
    font-size:15px;
    padding:10px 10px;
    border:1px solid var(--ink);
    background:#fff;
    color:var(--ink);
  }
  input[type="text"], input[type="date"]{
    font-size:15px;
    padding:10px 10px;
    border:1px solid var(--ink);
    background:#fff;
    color:var(--ink);
    width:100%;
  }
  input[type="color"]{
    width:36px;height:36px;border:1px solid var(--ink);padding:0;background:#fff;cursor:pointer;
  }
  .btn{
    border:1px solid var(--ink);
    background:#fff;
    color:var(--ink);
    padding:10px 14px;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
  }
  .btn:hover{background:var(--hover);}
  .btn.icon{padding:10px 13px;}
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.primary:hover{background:#2A2A2A;}
  .btn.ghost{border-color:var(--muted);color:var(--muted);}
  .btn.small{padding:6px 10px;font-size:13px;}
  .btn.danger{border-color:var(--ink);color:var(--ink);}
  .btn.danger:hover{background:var(--ink);color:#fff;}
  .btn:disabled{opacity:0.35;cursor:default;}
  .btn:disabled:hover{background:#fff;}

  /* ---------- Category filter chips ---------- */
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:28px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    border:1px solid var(--ink);
    background:#fff;
    font-size:15px;
    color:var(--muted);
    cursor:pointer;
  }
  .chip.active{color:var(--ink);background:var(--hover);font-weight:700;}
  .chip .sw{width:12px;height:12px;flex:0 0 auto;}

  /* ---------- Layout: calendar 3 : sidebar 2 ---------- */
  .layout{
    display:grid;
    grid-template-columns:3fr 2fr;
    gap:26px;
    align-items:flex-start;
  }
  .calendar-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
  }

  /* ---------- Month card: old-calendar feel ---------- */
  .month-card{
    background:#fff;
    border:1px solid var(--ink);
    padding:16px 14px 14px;
  }
  .month-card h2{
    font-weight:900;
    font-size:22px;
    margin:0 0 12px;
    text-align:center;
  }
  .weekday-row, .day-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
  }
  .weekday-row{margin-bottom:2px;}
  .weekday-row span{
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:var(--muted);
    padding-bottom:6px;
  }
  .weekday-row span:first-child, .weekday-row span:last-child{color:var(--ink);}

  .day-cell{
    position:relative;
    aspect-ratio:1/0.95;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--grid-line);
  }
  .day-cell.empty{border-color:transparent;}
  .day-cell.has-events{font-weight:900;cursor:pointer;}
  .day-cell.has-events:hover{outline:2px solid var(--ink);outline-offset:-2px;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    position:sticky;
    top:24px;
    background:#fff;
    border:1px solid var(--ink);
    padding:0;
    max-height:calc(100vh - 48px);
    display:flex;
    flex-direction:column;
  }
  .tab-row{
    display:flex;
    border-bottom:1px solid var(--ink);
  }
  .tab-row button{
    flex:1;
    border:none;
    border-right:1px solid var(--ink);
    background:#fff;
    color:var(--muted);
    padding:14px 4px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .tab-row button:last-child{border-right:none;}
  .tab-row button.active{background:var(--ink);color:#fff;}

  .tab-panel{display:none;padding:18px;overflow-y:auto;}
  .tab-panel.active{display:flex;flex-direction:column;flex:1;min-height:0;}

  /* -- list panel -- */
  .mode-switch{
    display:flex;
    border:1px solid var(--ink);
    margin-bottom:16px;
    flex:0 0 auto;
  }
  .mode-switch button{
    flex:1;
    border:none;
    border-right:1px solid var(--ink);
    background:#fff;
    padding:9px 0;
    font-size:14px;
    color:var(--muted);
    cursor:pointer;
  }
  .mode-switch button:last-child{border-right:none;}
  .mode-switch button.active{background:var(--ink);color:#fff;}

  .event-list{overflow-y:auto;flex:1;min-height:0;}
  .group-title{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin:16px 0 7px;
    display:flex;
    align-items:center;
    gap:7px;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .group-title:first-child{margin-top:0;}
  .group-title .sw{width:9px;height:9px;}

  .event-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 4px;
    font-size:15.5px;
    border-bottom:1px solid #E7E7E7;
    transition:background-color .3s ease, color .3s ease;
  }
  .event-row:hover{background:var(--hover);}
  .event-row.highlight{background:var(--ink);color:#fff;}
  .event-row .sw{width:10px;height:10px;flex:0 0 auto;}
  .event-row .label{
    flex:1;
    text-align:left;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .event-row .date{
    flex:0 0 auto;
    text-align:right;
    color:var(--muted);
    font-size:14px;
    font-variant-numeric:tabular-nums;
  }
  .event-row.highlight .date{color:#ddd;}
  .event-row .edit, .event-row .del{
    border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;padding:0 3px;
    visibility:hidden;
  }
  .event-row .del{font-size:17px;}
  .event-row:hover .edit, .event-row:hover .del{visibility:visible;}
  .event-row.highlight .edit, .event-row.highlight .del{color:#fff;}
  .empty-note{color:var(--muted);font-size:15px;padding:10px 4px;}

  .event-edit-form{
    display:flex;
    flex-direction:column;
    gap:9px;
    padding:12px 10px;
    border:1px solid var(--ink);
    background:var(--hover);
    margin:4px 0;
  }
  .event-edit-form .row2{display:flex;gap:8px;}
  .event-edit-form .row2 > *{flex:1;}
  .event-edit-form select{width:100%;}
  .event-edit-form .chk{display:flex;align-items:center;gap:7px;font-size:14px;}
  .event-edit-form .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:2px;}

  /* -- category panel -- */
  .cat-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #E7E7E7;
  }
  .cat-row input[type="text"]{flex:1;}
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .new-cat-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    padding-top:16px;
    border-top:2px solid var(--ink);
  }

  /* -- add event panel -- */
  .checkbox-row{display:flex;align-items:center;gap:9px;font-size:15px;margin-bottom:16px;}
  .date-fields{display:flex;gap:10px;}
  .date-fields .field{flex:1;margin-bottom:0;}
  #addEventForm .btn.primary{width:100%;margin-top:6px;}
  .note{font-size:13.5px;color:var(--muted);margin-top:18px;padding-top:16px;border-top:1px solid #E7E7E7;line-height:1.6;}

  /* ---------- export overlay ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,10,10,0.55);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.open{display:flex;}
  .overlay-box{
    background:#fff;border:1px solid var(--ink);width:min(660px,100%);max-height:80vh;
    display:flex;flex-direction:column;
  }
  .overlay-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 18px;border-bottom:1px solid var(--ink);
  }
  .overlay-head h3{margin:0;font-size:18px;font-weight:700;}
  .overlay-body{padding:18px;overflow-y:auto;}
  .overlay-body p{font-size:14px;color:var(--muted);margin-top:0;}
  .overlay-body textarea{
    width:100%;height:320px;border:1px solid var(--ink);font-family:monospace;font-size:13px;
    padding:10px;resize:vertical;
  }
  .overlay-foot{padding:14px 18px;border-top:1px solid var(--ink);display:flex;justify-content:flex-end;gap:8px;}

  @media (max-width: 980px){
    .layout{grid-template-columns:1fr;}
    .calendar-grid{grid-template-columns:repeat(2,1fr);}
    .sidebar{position:static;max-height:none;}
  }
  @media (max-width: 620px){
    .calendar-grid{grid-template-columns:1fr;}
  }
  @media (hover: none){
    .event-row .edit, .event-row .del{visibility:visible;}
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>연간 일정 캘린더</h1>
    <p><span id="rangeLabel"></span> · 12개월 보기</p>
  </div>
  <div class="header-actions">
    <div class="date-nav">
      <button class="btn icon" id="prevMonth" title="이전 달로 이동">◀</button>
      <select id="yearSelect"></select>
      <select id="monthSelect"></select>
      <button class="btn primary" id="jumpBtn">이동</button>
      <button class="btn icon" id="nextMonth" title="다음 달로 이동">▶</button>
    </div>
    <button class="btn ghost" id="exportBtn">코드로 내보내기</button>
  </div>
</header>

<div class="chip-row" id="chipRow"></div>

<div class="layout">
  <div class="calendar-grid" id="calendarGrid"></div>

  <aside class="sidebar">
    <div class="tab-row">
      <button id="tabList" class="active">일정 목록</button>
      <button id="tabCategories">카테고리</button>
      <button id="tabAdd">일정 추가</button>
    </div>

    <div class="tab-panel active" id="panelList">
      <div class="mode-switch">
        <button id="modeColor" class="active">색상별</button>
        <button id="modeDate">날짜순</button>
      </div>
      <div class="event-list" id="eventList"></div>
    </div>

    <div class="tab-panel" id="panelCategories">
      <div id="catList"></div>
      <div class="new-cat-row">
        <input type="color" id="newCatColor" value="#0A0A0A">
        <input type="text" id="newCatName" placeholder="새 카테고리 이름">
        <button class="btn small primary" id="addCatBtn">추가</button>
      </div>
    </div>

    <div class="tab-panel" id="panelAdd">
      <form id="addEventForm">
        <div class="field">
          <label for="evLabel">일정 이름</label>
          <input type="text" id="evLabel" required placeholder="예: 부산 출장">
        </div>
        <div class="field">
          <label for="evCategory">카테고리</label>
          <select id="evCategory" required></select>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="evMultiDay">
          <label for="evMultiDay">여러 날에 걸친 일정</label>
        </div>
        <div class="date-fields">
          <div class="field">
            <label for="evStart">시작일</label>
            <input type="date" id="evStart" required>
          </div>
          <div class="field" id="endDateField" style="display:none;">
            <label for="evEnd">종료일</label>
            <input type="date" id="evEnd">
          </div>
        </div>
        <button type="submit" class="btn primary">일정 추가</button>
      </form>
      <p class="note">이 페이지에서의 추가/수정은 현재 세션에만 저장됩니다. GitHub 저장소에 영구 반영하려면 상단 "코드로 내보내기"로 코드를 복사해 index.html의 CATEGORIES / EVENTS 부분에 붙여넣고 커밋하세요.</p>
    </div>
  </aside>
</div>

<div class="overlay" id="exportOverlay">
  <div class="overlay-box">
    <div class="overlay-head">
      <h3>코드로 내보내기</h3>
      <button class="btn small" id="closeOverlay">닫기</button>
    </div>
    <div class="overlay-body">
      <p>아래 코드를 복사해서 index.html 안의 CATEGORIES, EVENTS 선언부를 통째로 교체하세요.</p>
      <textarea id="exportText" readonly></textarea>
    </div>
    <div class="overlay-foot">
      <button class="btn primary" id="copyExport">복사</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   설정: 시작 연/월을 바꾸면 그 달부터 11개월 뒤(총 12개월)까지 표시됩니다.
   ========================================================= */
const CONFIG = {
  startYear: 2012,
  startMonth: 12   // 1~12
};

/* =========================================================
   카테고리 & 일정 데이터
   ========================================================= */
let CATEGORIES = [
  { id:'c1', name:'출장',   color:'#2F6F6D' },
  { id:'c2', name:'휴가',   color:'#C98A3B' },
  { id:'c3', name:'마감',   color:'#A8503D' },
  { id:'c4', name:'회의',   color:'#4C6A92' },
  { id:'c5', name:'이벤트', color:'#8B5A83' }
];

let EVENTS = [
  { id:1,  date:'2012-12-05',                     categoryId:'c1', label:'부산 출장' },
  { id:2,  date:'2012-12-24', endDate:'2012-12-26', categoryId:'c2', label:'연말 연휴' },
  { id:3,  date:'2013-01-02',                     categoryId:'c3', label:'분기 보고서 마감' },
  { id:4,  date:'2013-01-15',                     categoryId:'c4', label:'전사 킥오프 회의' },
  { id:5,  date:'2013-02-14',                     categoryId:'c5', label:'팀 워크숍' },
  { id:6,  date:'2013-02-14',                     categoryId:'c3', label:'예산안 제출' },
  { id:7,  date:'2013-03-10', endDate:'2013-03-14', categoryId:'c2', label:'봄 휴가' },
  { id:8,  date:'2013-04-01',                     categoryId:'c1', label:'도쿄 출장' },
  { id:9,  date:'2013-04-01',                     categoryId:'c4', label:'파트너사 미팅' },
  { id:10, date:'2013-05-20',                     categoryId:'c3', label:'상반기 결산' },
  { id:11, date:'2013-06-09',                     categoryId:'c5', label:'사내 해커톤' },
  { id:12, date:'2013-07-04', endDate:'2013-07-06', categoryId:'c1', label:'싱가포르 출장' },
  { id:13, date:'2013-08-15', endDate:'2013-08-20', categoryId:'c2', label:'여름 휴가' },
  { id:14, date:'2013-09-02',                     categoryId:'c4', label:'이사회 보고' },
  { id:15, date:'2013-10-11',                     categoryId:'c5', label:'제품 런칭' },
  { id:16, date:'2013-10-11',                     categoryId:'c3', label:'런칭 자료 마감' },
  { id:17, date:'2013-11-25',                     categoryId:'c4', label:'연말 결산 회의' }
];

let nextEventId = Math.max(0, ...EVENTS.map(e=>e.id)) + 1;
let nextCatSeq = CATEGORIES.length + 1;

/* =========================================================
   상태 & 유틸
   ========================================================= */
const WEEKDAYS = ['일','월','화','수','목','금','토'];
const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

let state = {
  startYear: CONFIG.startYear,
  startMonth: CONFIG.startMonth,
  activeCategoryIds: new Set(CATEGORIES.map(c=>c.id)),
  sidebarMode: 'color',
  editingId: null
};

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function pad2(n){ return String(n).padStart(2,'0'); }

function monthsInRange(startYear, startMonth){
  const list = [];
  for(let i=0;i<12;i++){
    let y = startYear + Math.floor((startMonth - 1 + i)/12);
    let m = ((startMonth - 1 + i) % 12) + 1;
    list.push({year:y, month:m});
  }
  return list;
}
function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }
function firstWeekday(year, month){ return new Date(year, month-1, 1).getDay(); }
function getCategory(id){ return CATEGORIES.find(c=>c.id===id); }

function eventsOnDate(dateStr){
  return EVENTS.filter(e=>{
    const start = e.date;
    const end = e.endDate || e.date;
    return dateStr >= start && dateStr <= end && state.activeCategoryIds.has(e.categoryId);
  });
}

/* =========================================================
   렌더: 헤더 / 셀렉트 / 칩
   ========================================================= */
function populateSelectors(){
  const yearSel = document.getElementById('yearSelect');
  const monthSel = document.getElementById('monthSelect');
  yearSel.innerHTML = '';
  monthSel.innerHTML = '';
  const thisYear = state.startYear;
  for(let y = thisYear - 15; y <= thisYear + 15; y++){
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y + '년';
    if(y === state.startYear) opt.selected = true;
    yearSel.appendChild(opt);
  }
  MONTH_NAMES.forEach((name, idx)=>{
    const opt = document.createElement('option');
    opt.value = idx+1; opt.textContent = name;
    if(idx+1 === state.startMonth) opt.selected = true;
    monthSel.appendChild(opt);
  });
}

function updateRangeLabel(){
  const months = monthsInRange(state.startYear, state.startMonth);
  const first = months[0], last = months[months.length-1];
  document.getElementById('rangeLabel').textContent =
    `${first.year}.${pad2(first.month)} – ${last.year}.${pad2(last.month)}`;
}

function renderChips(){
  const row = document.getElementById('chipRow');
  row.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (state.activeCategoryIds.has(cat.id) ? ' active' : '');
    chip.innerHTML = `<span class="sw" style="background:${cat.color}"></span>${cat.name}`;
    chip.addEventListener('click', ()=>{
      if(state.activeCategoryIds.has(cat.id)) state.activeCategoryIds.delete(cat.id);
      else state.activeCategoryIds.add(cat.id);
      renderAll(false);
    });
    row.appendChild(chip);
  });
}

/* =========================================================
   렌더: 달력 3x4
   ========================================================= */
function renderCalendar(){
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';
  const months = monthsInRange(state.startYear, state.startMonth);

  months.forEach(({year, month})=>{
    const card = document.createElement('div');
    card.className = 'month-card';

    const h2 = document.createElement('h2');
    h2.textContent = `${year}년 ${MONTH_NAMES[month-1]}`;
    card.appendChild(h2);

    const weekdayRow = document.createElement('div');
    weekdayRow.className = 'weekday-row';
    WEEKDAYS.forEach(w=>{
      const s = document.createElement('span');
      s.textContent = w;
      weekdayRow.appendChild(s);
    });
    card.appendChild(weekdayRow);

    const dayGrid = document.createElement('div');
    dayGrid.className = 'day-grid';

    const leading = firstWeekday(year, month);
    const totalDays = daysInMonth(year, month);
    const totalCells = 42;

    for(let i=0;i<totalCells;i++){
      const dayNum = i - leading + 1;
      const cell = document.createElement('div');

      if(dayNum < 1 || dayNum > totalDays){
        cell.className = 'day-cell empty';
        dayGrid.appendChild(cell);
        continue;
      }

      const dateStr = `${year}-${pad2(month)}-${pad2(dayNum)}`;
      const dayEvents = eventsOnDate(dateStr);

      cell.className = 'day-cell' + (dayEvents.length?' has-events':'');
      cell.textContent = dayNum;

      if(dayEvents.length === 1){
        cell.style.background = hexToRgba(getCategory(dayEvents[0].categoryId).color, 0.38);
      } else if(dayEvents.length > 1){
        const n = dayEvents.length;
        const stops = [];
        dayEvents.forEach((e, idx)=>{
          const startPct = (idx/n*100).toFixed(2);
          const endPct = ((idx+1)/n*100).toFixed(2);
          const c = hexToRgba(getCategory(e.categoryId).color, 0.42);
          stops.push(`${c} ${startPct}%`, `${c} ${endPct}%`);
        });
        cell.style.background = `linear-gradient(90deg, ${stops.join(', ')})`;
      }

      if(dayEvents.length){
        cell.title = dayEvents.map(e=>`[${getCategory(e.categoryId).name}] ${e.label}`).join('\n');
        cell.addEventListener('click', ()=> showEventsForDate(dayEvents));
      }

      dayGrid.appendChild(cell);
    }

    card.appendChild(dayGrid);
    grid.appendChild(card);
  });
}

/* =========================================================
   날짜 클릭 -> 일정 목록에서 바로 보여주기
   ========================================================= */
function showEventsForDate(dayEvents){
  switchTab('list');
  const ids = dayEvents.map(e=>e.id);
  requestAnimationFrame(()=>{
    let firstEl = null;
    document.querySelectorAll('.event-row').forEach(row=>{
      const id = parseInt(row.dataset.id, 10);
      if(ids.includes(id)){
        row.classList.add('highlight');
        if(!firstEl) firstEl = row;
        setTimeout(()=> row.classList.remove('highlight'), 1600);
      }
    });
    if(firstEl) firstEl.scrollIntoView({behavior:'smooth', block:'center'});
  });
}

/* =========================================================
   렌더: 우측 일정 목록 (이름 좌측 / 날짜 우측, 한 줄)
   ========================================================= */
function formatDateShort(e){
  const s = e.date.slice(5).replace('-','.');
  if(e.endDate && e.endDate !== e.date){
    return `${s} – ${e.endDate.slice(5).replace('-','.')}`;
  }
  return s;
}

function renderSidebarList(){
  const list = document.getElementById('eventList');
  list.innerHTML = '';

  const months = monthsInRange(state.startYear, state.startMonth);
  const rangeStart = `${months[0].year}-${pad2(months[0].month)}-01`;
  const lastM = months[months.length-1];
  const rangeEnd = `${lastM.year}-${pad2(lastM.month)}-${pad2(daysInMonth(lastM.year, lastM.month))}`;

  const visible = EVENTS.filter(e =>
    state.activeCategoryIds.has(e.categoryId) &&
    e.date <= rangeEnd && (e.endDate || e.date) >= rangeStart
  );

  if(!visible.length){
    list.innerHTML = '<div class="empty-note">표시할 일정이 없습니다. 상단 필터를 확인해 보세요.</div>';
    return;
  }

  if(state.sidebarMode === 'date'){
    const sorted = [...visible].sort((a,b)=> a.date.localeCompare(b.date));
    sorted.forEach(e=> list.appendChild(makeEventRow(e)));
  } else {
    CATEGORIES.forEach(cat=>{
      const items = visible.filter(e=>e.categoryId===cat.id).sort((a,b)=>a.date.localeCompare(b.date));
      if(!items.length) return;
      const title = document.createElement('div');
      title.className = 'group-title';
      title.innerHTML = `<span class="sw" style="background:${cat.color}"></span>${cat.name}`;
      list.appendChild(title);
      items.forEach(e=> list.appendChild(makeEventRow(e)));
    });
  }
}

function makeEventRow(e){
  if(state.editingId === e.id){
    return makeEventEditRow(e);
  }
  const cat = getCategory(e.categoryId);
  const row = document.createElement('div');
  row.className = 'event-row';
  row.dataset.id = e.id;
  row.innerHTML = `
    <span class="sw" style="background:${cat ? cat.color : '#999'}"></span>
    <span class="label">${e.label}</span>
    <span class="date">${formatDateShort(e)}</span>
    <button class="edit" title="수정">✎</button>
    <button class="del" title="삭제">×</button>
  `;
  row.querySelector('.edit').addEventListener('click', ()=>{
    state.editingId = e.id;
    renderSidebarList();
  });
  row.querySelector('.del').addEventListener('click', ()=>{
    EVENTS = EVENTS.filter(ev=>ev.id!==e.id);
    renderAll(false);
  });
  return row;
}

function makeEventEditRow(e){
  const wrap = document.createElement('div');
  wrap.className = 'event-edit-form';
  wrap.dataset.id = e.id;

  const catOptions = CATEGORIES.map(c=>
    `<option value="${c.id}" ${c.id===e.categoryId?'selected':''}>${c.name}</option>`
  ).join('');

  wrap.innerHTML = `
    <input type="text" class="f-label" value="${e.label.replace(/"/g,'&quot;')}" placeholder="일정 이름">
    <select class="f-category">${catOptions}</select>
    <label class="chk"><input type="checkbox" class="f-multiday" ${e.endDate ? 'checked' : ''}> 여러 날에 걸친 일정</label>
    <div class="row2">
      <div>
        <input type="date" class="f-start" value="${e.date}">
      </div>
      <div class="f-end-wrap" style="display:${e.endDate ? '' : 'none'};">
        <input type="date" class="f-end" value="${e.endDate || ''}">
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn small ghost f-cancel">취소</button>
      <button type="button" class="btn small primary f-save">저장</button>
    </div>
  `;

  const multiDayChk = wrap.querySelector('.f-multiday');
  const endWrap = wrap.querySelector('.f-end-wrap');
  multiDayChk.addEventListener('change', ()=>{
    endWrap.style.display = multiDayChk.checked ? '' : 'none';
  });

  wrap.querySelector('.f-cancel').addEventListener('click', ()=>{
    state.editingId = null;
    renderSidebarList();
  });

  wrap.querySelector('.f-save').addEventListener('click', ()=>{
    const label = wrap.querySelector('.f-label').value.trim();
    const categoryId = wrap.querySelector('.f-category').value;
    const start = wrap.querySelector('.f-start').value;
    const multiDay = multiDayChk.checked;
    const end = wrap.querySelector('.f-end').value;
    if(!label || !categoryId || !start) return;

    e.label = label;
    e.categoryId = categoryId;
    e.date = start;
    if(multiDay && end && end >= start){
      e.endDate = end;
    } else {
      delete e.endDate;
    }

    state.editingId = null;
    renderAll(false);
  });

  return wrap;
}

/* =========================================================
   렌더: 카테고리 관리 패널
   ========================================================= */
function renderCategoryPanel(){
  const wrap = document.getElementById('catList');
  wrap.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.innerHTML = `
      <input type="color" value="${cat.color}">
      <input type="text" value="${cat.name}">
      <button class="btn small danger" title="삭제">×</button>
    `;
    const [colorInput, nameInput, delBtn] = row.children;
    colorInput.addEventListener('input', ()=>{
      cat.color = colorInput.value;
      renderAll(false);
    });
    nameInput.addEventListener('change', ()=>{
      cat.name = nameInput.value.trim() || cat.name;
      renderAll(false);
    });
    delBtn.addEventListener('click', ()=>{
      const used = EVENTS.some(e=>e.categoryId===cat.id);
      if(used && !confirm(`"${cat.name}" 카테고리를 사용하는 일정이 있습니다. 함께 삭제할까요?`)) return;
      EVENTS = EVENTS.filter(e=>e.categoryId!==cat.id);
      CATEGORIES = CATEGORIES.filter(c=>c.id!==cat.id);
      state.activeCategoryIds.delete(cat.id);
      renderAll(false);
    });
    wrap.appendChild(row);
  });
}

document.getElementById('addCatBtn').addEventListener('click', ()=>{
  const nameInput = document.getElementById('newCatName');
  const colorInput = document.getElementById('newCatColor');
  const name = nameInput.value.trim();
  if(!name) return;
  const id = 'c' + (nextCatSeq++);
  CATEGORIES.push({ id, name, color: colorInput.value });
  state.activeCategoryIds.add(id);
  nameInput.value = '';
  renderAll(false);
});

/* =========================================================
   일정 추가 폼
   ========================================================= */
function populateCategorySelect(){
  const sel = document.getElementById('evCategory');
  const prev = sel.value;
  sel.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const opt = document.createElement('option');
    opt.value = cat.id; opt.textContent = cat.name;
    sel.appendChild(opt);
  });
  if(CATEGORIES.some(c=>c.id===prev)) sel.value = prev;
}

document.getElementById('evMultiDay').addEventListener('change', (e)=>{
  document.getElementById('endDateField').style.display = e.target.checked ? '' : 'none';
});

document.getElementById('addEventForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const label = document.getElementById('evLabel').value.trim();
  const categoryId = document.getElementById('evCategory').value;
  const start = document.getElementById('evStart').value;
  const multiDay = document.getElementById('evMultiDay').checked;
  const end = document.getElementById('evEnd').value;
  if(!label || !categoryId || !start) return;

  const newEvent = { id: nextEventId++, date: start, categoryId, label };
  if(multiDay && end && end >= start) newEvent.endDate = end;
  EVENTS.push(newEvent);

  document.getElementById('evLabel').value = '';
  document.getElementById('evStart').value = '';
  document.getElementById('evEnd').value = '';
  document.getElementById('evMultiDay').checked = false;
  document.getElementById('endDateField').style.display = 'none';

  renderAll(false);
});

/* =========================================================
   탭 전환
   ========================================================= */
function switchTab(tab){
  ['List','Categories','Add'].forEach(name=>{
    document.getElementById('tab'+name).classList.toggle('active', name.toLowerCase()===tab);
    document.getElementById('panel'+name).classList.toggle('active', name.toLowerCase()===tab);
  });
}
document.getElementById('tabList').addEventListener('click', ()=>switchTab('list'));
document.getElementById('tabCategories').addEventListener('click', ()=>switchTab('categories'));
document.getElementById('tabAdd').addEventListener('click', ()=>switchTab('add'));

/* =========================================================
   내보내기
   ========================================================= */
function buildExportCode(){
  const catLines = CATEGORIES.map(c=>
    `  { id:'${c.id}', name:'${c.name}', color:'${c.color}' }`).join(',\n');
  const evLines = EVENTS.map(e=>{
    const end = e.endDate ? `, endDate:'${e.endDate}'` : '';
    return `  { id:${e.id}, date:'${e.date}'${end}, categoryId:'${e.categoryId}', label:'${e.label.replace(/'/g,"\\'")}' }`;
  }).join(',\n');
  return `let CATEGORIES = [\n${catLines}\n];\n\nlet EVENTS = [\n${evLines}\n];`;
}
document.getElementById('exportBtn').addEventListener('click', ()=>{
  document.getElementById('exportText').value = buildExportCode();
  document.getElementById('exportOverlay').classList.add('open');
});
document.getElementById('closeOverlay').addEventListener('click', ()=>{
  document.getElementById('exportOverlay').classList.remove('open');
});
document.getElementById('copyExport').addEventListener('click', ()=>{
  const ta = document.getElementById('exportText');
  ta.select();
  document.execCommand('copy');
});

/* =========================================================
   초기화
   ========================================================= */
function renderAll(resetSelectors){
  updateRangeLabel();
  if(resetSelectors) populateSelectors();
  renderChips();
  renderCalendar();
  renderSidebarList();
  renderCategoryPanel();
  populateCategorySelect();
}

function shiftStart(delta){
  const totalMonths = (state.startYear*12 + (state.startMonth-1)) + delta;
  state.startYear = Math.floor(totalMonths/12);
  state.startMonth = (totalMonths%12) + 1;
  renderAll(true);
}

document.getElementById('jumpBtn').addEventListener('click', ()=>{
  state.startYear = parseInt(document.getElementById('yearSelect').value, 10);
  state.startMonth = parseInt(document.getElementById('monthSelect').value, 10);
  renderAll(false);
});
document.getElementById('prevMonth').addEventListener('click', ()=> shiftStart(-1));
document.getElementById('nextMonth').addEventListener('click', ()=> shiftStart(1));

document.getElementById('modeColor').addEventListener('click', ()=>{
  state.sidebarMode = 'color';
  document.getElementById('modeColor').classList.add('active');
  document.getElementById('modeDate').classList.remove('active');
  renderSidebarList();
});
document.getElementById('modeDate').addEventListener('click', ()=>{
  state.sidebarMode = 'date';
  document.getElementById('modeDate').classList.add('active');
  document.getElementById('modeColor').classList.remove('active');
  renderSidebarList();
});

populateSelectors();
renderAll(false);
</script>
